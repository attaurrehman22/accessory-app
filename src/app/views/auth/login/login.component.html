<div class="login-container">
  <div class="login-card">
    <h2>Hey there!</h2>
    <h1>Welcome Back</h1>
    <form>
      <div class="form-group">
        <label class="d-flex">Email</label>
        <input
          type="email"
          placeholder="Enter your email address..."
          required
        />
      </div>
      <div class="form-group">
        <label class="d-flex">Password</label>
        <input type="password" placeholder="Enter your password" required />
      </div>
      <div class="form-group">
        <label class="d-flex">Confirm Password</label>
        <input type="password" placeholder="Confirm password" required />
      </div>
      <div class="mt-3" style="display: flex; justify-content: end">
        <a href="#">Forgot password?</a>
      </div>
      <button class="login-btn mt-3" (click)="gotoRegister()">Register</button>
    </form>
    <div class="separator">OR</div>
    <div class="social-login">
      <button class="social-btn facebook"><mat-icon>facebook</mat-icon></button>
      <button class="social-btn apple"><mat-icon>apple</mat-icon></button>
      <button class="social-btn google"><img style="height: 3vh;" src="./assets/images/google.png"/></button>
    </div>
    <div class="mt-5">
      <p style="font-weight: 400; font-size: 14px; color: #909090">
        Don't have an account?
        <a style="color: #0f172a; font-weight: 500; font-size: 16px;cursor: pointer;"
        (click)="login()"
          >Login</a
        >
      </p>
    </div>
  </div>
</div>
