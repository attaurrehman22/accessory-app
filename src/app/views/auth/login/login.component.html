<div class="login-container">
  <div class="login-card">
    <h2>Hey there!</h2>
    <h1>Welcome Back</h1>
    <form [formGroup]="loginForm">
      <div>
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Email</mat-label>
          <input
            type="email"
            placeholder="Enter Email"
            required
            matInput
            formControlName="email"
          />
          <mat-error *ngIf="loginForm.get('name')?.hasError('required')">
            Enter Email
          </mat-error>
          <mat-error *ngIf="loginForm.get('name')?.hasError('email')">
            Enter Valid Email
          </mat-error>
        </mat-form-field>
      </div>
      <div class="mt-3">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Password</mat-label>
          <input
            formControlName="password"
            matInput
            type="password"
            placeholder="Enter your password"
            required
          />
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Enter Password
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters long
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('maxlength')">
            Password cannot exceed 30 characters
          </mat-error>
        </mat-form-field>
      </div>

      <div class="mt-3" style="display: flex; justify-content: end">
        <a href="#">Forgot password?</a>
      </div>
    </form>
    <button class="login-btn mt-3" type="submit" (click)="gotoHome()">
      Login
    </button>
    <div class="separator">OR</div>
    <div class="social-login">
      <button class="social-btn facebook"><mat-icon>facebook</mat-icon></button>
      <button class="social-btn apple"><mat-icon>apple</mat-icon></button>
      <button class="social-btn google">
        <img style="height: 3vh" src="./assets/images/google.png" />
      </button>
    </div>
    <div class="mt-5">
      <p style="font-weight: 400; font-size: 14px; color: #909090">
        Don't have an account?
        <a
          style="
            color: #0f172a;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
          "
          (click)="gotoRegister()"
          >Register</a
        >
      </p>
    </div>
  </div>
</div>
