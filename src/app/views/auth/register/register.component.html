<div class="login-container">
  <div class="login-card">
    <h2>Welcome to Chronosouq</h2>
    <h1>Create a new account</h1>
    <form [formGroup]="registerForm">
      <div>
        <mat-label class="d-flex">Email</mat-label>
        <mat-form-field appearance="outline" style="width: 100%">
          <input
            type="email"
            placeholder="Enter your email address..."
            required
            matInput
            formControlName="email"
          />
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
            Enter Email
          </mat-error>
        </mat-form-field>
      </div>
      <div>
        <mat-label class="d-flex">Password</mat-label>
        <mat-form-field appearance="outline" style="width: 100%">
          <input
            formControlName="password"
            matInput
            type="password"
            placeholder="Enter your password"
            required
          />
          <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
            Enter Password
          </mat-error>
        </mat-form-field>
      </div>
      <div >
        <mat-label class="d-flex">Confirm Password</mat-label>
        <mat-form-field appearance="outline" style="width: 100%">
          <input
            formControlName="conirmPassword"
            matInput
            type="password"
            placeholder="Confirm password"
            formControlName="password"
            required
          />
          <mat-error *ngIf="registerForm.get('conirmPassword')?.hasError('required')">
            Enter Confirm Password
          </mat-error>
        </mat-form-field>
      </div>
      <button class="login-btn mt-3" (click)="login()">Register</button>
    </form>
    <div class="separator">OR</div>
    <div class="social-login">
      <button class="social-btn facebook"><mat-icon>facebook</mat-icon></button>
      <button class="social-btn apple"><mat-icon>apple</mat-icon></button>
      <button class="social-btn google"><img style="height: 3vh;" src="./assets/images/google.png"/></button>
    </div>
    <div class="mt-5">
      <p style="font-weight: 400; font-size: 14px; color: #909090">
        Already have an account?
        <a style="color: #0f172a; font-weight: 500; font-size: 16px;cursor: pointer;"
        (click)="gotologin()"
          >Login</a
        >
      </p>
    </div>
  </div>
</div>
