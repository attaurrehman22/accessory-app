<div class="global-main-wraper">
  <div class="marquee-container" #container>
    <div class="marquee-track" #slider>
      <div
        *ngFor="let img of duplicatedImages; let index = index"
        class="slide"
        [style.width.px]="imageWidth"
        [style.margin.px]="slideMargin"
        [innerHTML]="img | safeHtml"
      >
      </div>
    </div>
  </div>
</div>
