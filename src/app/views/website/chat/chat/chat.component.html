<div class="container-fluid main-wrapper mt-5">
  <div class="row">
    <!-- Left Sidebar: Contacts list -->
    <div class="col-md-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Chats</h3>
        <button class="unread-btn">Unread Filter</button>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button
          (click)="activeOption('All')"
          class="action-btn"
          [ngClass]="
            isActive === 'All'
              ? 'active-bottom-border'
              : 'deactive-bottom-border'
          "
        >
          All
        </button>
        <button
          (click)="activeOption('Buy')"
          class="action-btn"
          [ngClass]="
            isActive === 'Buy'
              ? 'active-bottom-border'
              : 'deactive-bottom-border'
          "
        >
          Buy
        </button>
        <button
          (click)="activeOption('Sell')"
          class="action-btn"
          [ngClass]="
            isActive === 'Sell'
              ? 'active-bottom-border'
              : 'deactive-bottom-border'
          "
        >
          Sell
        </button>
      </div>
      <div class="list-group">
        <div
          *ngFor="let chat of chats"
          class="list-group-item d-flex justify-content-between align-items-start"
        >
          <div class="d-flex">
            <img
              [src]="chat.image"
              alt="chat image"
              class="img-thumbnail"
              style="width: 90px; height: 90px"
            />
            <div class="ms-3 d-flex flex-wrap">
              <div class="d-flex flex-wrap justify-content-between w-100">
                <p
                  [ngClass]="
                    chat.unread > 0 ? 'active-name-time' : 'deactive-name-time'
                  "
                >
                  {{ chat.name }}
                </p>
                <p
                  [ngClass]="
                    chat.unread > 0 ? 'active-name-time' : 'deactive-name-time'
                  "
                >
                  {{ chat.time }}
                </p>
              </div>
              <div class="d-flex flex-wrap justify-content-between w-100">
                <div class="d-flex flex-column">
                  <p class="mb-1 font-size-16 font-wight-500 color-242424">
                    {{ chat.modelName }}
                  </p>
                  <p class="font-size-14 font-wight-400 color-242424">
                    {{ chat.message }}
                  </p>
                </div>
                <span *ngIf="chat.unread > 0" class="badge-styl">
                  {{ chat.unread }}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Section: Chat window -->
    <div class="col-md-8">
      <div class="card">
        <div
          class="card-header d-flex flex-wrap justify-content-between"
          style="background: #f9fafb"
        >
          <div class="d-flex" style="width: 95%">
            <div class="">
              <img
                [src]="chats[0].image"
                alt="chat image"
                class="img-thumbnail"
                style="width: 48px; height: 48px; border-radius: 30px"
              />
            </div>
            <div class="d-flex flex-column mx-2">
              <p class="font-size-20 font-wight-600 color-242424 margin-0">
                Muhamad Kamran
              </p>
              <p class="font-size-16 font-wight-400 color-909090 margin-0">
                Makkah
              </p>
            </div>
          </div>
          <div>
            <p>...</p>
          </div>
        </div>

        <div
          class="card-header d-flex flex-wrap justify-content-between card-header-bottom"
        >
          <div class="d-flex" style="width: 84%">
            <div class="">
              <img
                [src]="chats[0].image"
                alt="chat image"
                class="img-thumbnail"
                style="width: 48px; height: 48px"
              />
            </div>
            <div class="d-flex flex-column mx-2">
              <p class="font-size-20 font-wight-600 color-242424 margin-0">
                Rolex Speedmaster in a Good Condition but in low price
                <span
                  class="font-size-16 font-wight-400 color-909090 margin-0 mx-2"
                  >#12345</span
                >
              </p>
              <p class="font-size-16 font-wight-400 color-909090 margin-0">
                SR 2500
              </p>
            </div>
          </div>
          <div>
            <button class="view-add-btn">View Add</button>
          </div>
        </div>

        <div class="card-body" style="height: 400px; overflow-y: scroll">
          <div *ngFor="let message of messages">
            <div
              class="message"
              [class.sent]="message.sent"
              [class.received]="!message.sent"
            >
              <div class="message-content">
                <p>{{ message.text }}</p>
                <small>{{ message.timestamp | date : "shortTime" }}</small>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer">
            <div style="width: 4%;" class="d-flex">
                <button
                style="width: 0; height: 0; padding: 0"
                mat-icon-button
                [matMenuTriggerFor]="menu"
                (click)="$event.stopPropagation()"
                >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-plus"
                    viewBox="0 0 16 16"
                >
                    <path d="M8 7V1h1v6h6v1H9v6H8V8H2V7h6z" />
                </svg>
                </button>
                <mat-menu #menu="matMenu">
                <button mat-menu-item>
                    <span>Custom offer</span>
                </button>
                <button mat-menu-item>
                    <span>Upload Images</span>
                </button>
                </mat-menu>
            </div>
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              [(ngModel)]="newMessage"
              (keyup.enter)="sendMessage()"
              placeholder="Type a message..."
            />
            <button class="btn btn-dark" (click)="sendMessage()">
              Send
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
