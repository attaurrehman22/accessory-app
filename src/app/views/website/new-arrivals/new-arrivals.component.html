<div
class="global-main-wraper d-flex flex-wrap justify-content-between mt-5 mb-5"
>
   <div class="container-fluid mt-3">
        <div class="row">
        <div
            class="col-12"
            *ngIf="showList?.length == 0"
            style="
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 500;
            "
        >
            No record exist
        </div>
        <div class="col-md-3 col-sm-6 mb-4" *ngFor="let watch of showList">
            <div class="card h-100 shadow-sm">
            <a
                [routerLink]="['/buy-product']"
                [queryParams]="{ id: watch.id }"
                class="card-img-link"
            >
                <img
                style="cursor: pointer"
                [src]="'https://api.chronosouq.com/' + watch.main_image"
                class="card-img-top"
                alt="watch image"
                />
            </a>
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <div>
                    <p class="font-size-16 font-wight-400 color-6a6a6a" style="margin: 0 !important">
                      {{ watch.brand.name }} | {{ watch.model || "N/A" }}
                    </p>
                  </div>
                  <div>
                    <i class="fa fa-heart-o" aria-hidden="true"></i>
                  </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                  <p class="card-title d-flex flex-wrap">
                    {{ watch.title }}
                  </p>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-3">
                  <p class="price">
                    +{{ watch.shipping_charges }} {{ watch.currency }} Shipping
                  </p>
                  <div>
                    <p class="price">Location</p>
                  </div>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <p class="card-title-two">{{ watch.price }}</p>
                  <p class="card-title-two">{{ watch.created_by.city }}</p>
                </div>
                <div *ngIf="watch.created_by.type === 'user'" class="d-flex mt-2 seller-chip">
                  Private Seller
                </div>
                <div *ngIf="watch.created_by.type === 'dealer'" class="d-flex mt-2 seller-chip">
                  Dealer
                </div>
                <!-- Relative Time -->
                <div>
                  <p class="card-title">{{ getTimeAgo(watch.created_at) }}</p>
                </div>
              </div>
              
            </div>
            <div class="heart-icon">
            <div class="featured-icon">
                <div
                *ngIf="watch.feature_item === 1"
                class="featured-promoted-class-badge"
                >
                Featured
                </div>

                <div
                *ngIf="watch.feature_item !== 1 && watch.is_promoted === 1"
                class="featured-promoted-class-badge"
                >
                Promoted
                </div>
            </div>
            <i
                *ngIf="isUserLogin === 'true'"
                (click)="addWishList(watch)"
                class="fa"
                [ngClass]="
                wishList?.includes(watch.id) ? 'fa-heart' : 'fa-heart fa-heart-o'
                "
                aria-hidden="true"
            ></i>
            </div>
        </div>
        </div>
    </div>
</div>
