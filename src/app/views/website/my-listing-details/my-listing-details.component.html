<div class="container mt-5">
  <div class="col-12 d-flex flex-wrap">
    <div class="col-md-3">
      <div class="d-flex flex-column p-3 bg-light">
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item" *ngFor="let item of menuItems; let i = index">
            <a
              class="nav-link"
              [ngClass]="{ active: activeIndex === i }"
              (click)="setActive(i)"
            >
              <i class="{{ item.icon }}"></i> {{ item.label }}
            </a>
          </li>
        </ul>
      </div>
    </div>
    <div class="col-md-9">
      <!-- if "My Listing" is Active -->
      <div *ngIf="activeIndex === 3" class="container">
        <h4 class="mb-4">My Listings</h4>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <select class="form-select form-select-sm" style="width: 150px">
              <option selected>Status</option>
              <option value="1">In Process</option>
              <option value="2">Delivered</option>
              <option value="3">Cancelled</option>
            </select>
          </div>
          <div>
            <select class="form-select form-select-sm" style="width: 150px">
              <option selected>4 Weeks</option>
              <option value="1">1 Week</option>
              <option value="2">1 Month</option>
              <option value="3">6 Months</option>
            </select>
          </div>
        </div>
        <div class="list-cards">
          <div *ngFor="let listing of listings" class="card mb-3">
            <div class="card-body d-flex align-items-center">
              <div class="col-md-6">
                <small class="text-muted"
                  >Listing ID {{ listing.listing_code || "N/A" }} | Created
                  {{ listing.created_at }}</small
                >
                <h6 class="mt-1 mb-1">
                  {{ listing.brand.name }} {{ listing.model }}
                  {{ listing.title }}
                </h6>
                <!-- <span class="badge" [ngClass]="listing.statusClass">{{ listing.status || "In Process" }}</span> -->
                <span class="badge">{{ listing?.status || "In Process" }}</span>
              </div>
              <div class="col-md-6 d-flex justify-content-end">
                <button
                  mat-icon-button
                  [matMenuTriggerFor]="menu"
                  aria-label="More options"
                >
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="editListing(listing)">
                    <mat-icon>edit</mat-icon>
                    <span>Edit Product</span>
                  </button>
                  <button mat-menu-item (click)="deleteListing(listing)">
                    <mat-icon color="warn">delete</mat-icon>
                    <span>Delete</span>
                  </button>
                </mat-menu>
              </div>
              
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
