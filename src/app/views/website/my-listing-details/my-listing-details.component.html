<div class="mt-5 container">
<div class="col-12 d-flex flex-wrap mb-3" [ngClass]="{ 'reverse-order': translateService.currentLang !== 'en' }">
  <div class="col-md-3 arabic-style">
    <div class="d-flex flex-column p-lg-3 p-md-1 p-sm-1" style="height: 100%;background: none !important;">
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item" *ngFor="let item of menuItems; let i = index">
          <a *ngIf="translateService.currentLang == 'en'" class="nav-link d-flex align-items-center gap-2"
             [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
            <img [src]="item.white_icon" alt="Item" />
            <img [src]="item.black_icon" alt="Item" />
            {{ item.label }}
          </a>

          <a *ngIf="translateService.currentLang !== 'en'" class="nav-link d-flex align-items-center gap-2"
             [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
            {{ item.arabicLabel }}
            <img [src]="item.white_icon" alt="Item" />
            <img [src]="item.black_icon" alt="Item" />
          </a>
        </li>
      </ul>
    </div>
  </div>
  <div class="col-md-9" style="min-height: 85vh;"
    [ngClass]="{ 'reverse-order-details': translateService.currentLang !== 'en' }">
    <router-outlet></router-outlet>
  </div>
</div>
</div>
