<div
  class="global-main-wraper d-flex flex-wrap justify-content-between mt-5 mb-5"
  [ngClass]="{ 'reverse-order': translateService.currentLang !== 'en' }"
>
  <div class="container d-flex flex-wrap justify-content-center">
    <div class="col-lg-8 col-md-10 col-sm-12">
      <p class="text-center font-size-40 font-wight-600 color-484848">
        {{ "chrono_buyer.label" | translate }}
      </p>
    </div>
    <div class="col-lg-8 col-md-10 col-sm-12">
      <p
        class="text-center mt-2 font-size-18 font-wight-400 color-6a6a6a"
      >
        {{ "chrono_buyer.paragraph" | translate }}
      </p>
    </div>
    <div
      class="col-lg-12 col-md-12 col-sm-12 d-flex flex-wrap justify-content-center gap-2 mt-3"
    >
      <button
        *ngFor="let category of categoryNames"
        (click)="changeCategory(category)"
        class="category_btn"
        [ngClass]="{ 'selected-category': selectedCategory === category }"
      >
        {{ category.name }}
      </button>
    </div>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-4 col-sm-6 mb-4" *ngFor="let watch of showList">
          <div class="card h-100 shadow-sm">
            <img
            style="cursor: pointer;"
            (click)="routeToDetailPage(watch)"
              [src]="'https://api.chronosouq.com/' + watch.main_image"
              class="card-img-top"
              alt="watch image"
            />
            <div class="card-body">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <div>
                  <p class="font-size-16 font-wight-400 color-6a6a6a"
                    style="
                      margin: 0 !important;
                    "
                  >
                    {{ watch.brand.name }}
                  </p>
                </div>
                <div>
                  <i class="fa fa-heart-o" aria-hidden="true"></i>
                </div>
              </div>
              <div
                class="d-flex justify-content-between align-items-center mt-2"
              >
                <p class="card-title d-flex flex-wrap">
                  {{ watch.name }}
                </p>
              </div>
              <div
                class="d-flex justify-content-between align-items-center mt-3"
              >
                <p class="price">
                  +{{ watch.shipping_charges }} {{ watch.currency }} Shipping
                </p>
                <div>
                  <p class="price">Location</p>
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center">
                <p class="card-title-two">{{ watch.price }}</p>
                <p class="card-title-two">{{ watch.created_by.city }}</p>
              </div>
            </div>
          </div>
          <div class="heart-icon" (click)="toggleHeart(watch)">
            <i
              class="fa"
              [ngClass]="watch.liked ? 'fa-heart' : 'fa-heart fa-heart-o'"
              aria-hidden="true"
            ></i>
          </div>
        </div>
      </div>

      <div class="text-center">
        <button class="view_btn" (click)="goToList()">
          {{ "chrono_buyer.view_more" | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
