<nav class="navbar navbar-expand-lg navbar-light bg-light py-3" style="background-color: #fdfbff !important">
  <div class="container">
    <!-- Search Bar -->
    <form class="d-flex flex-grow-1 ms-3" (ngSubmit)="onSearch(searchQuery)">
      <input
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"

      />
      <button class="btn btn-outline-secondary" type="submit">
        <mat-icon>search</mat-icon>
      </button>
    </form>
  </div>
