<div class="global-main-wraper headerclass">
  <mat-sidenav-container>
    <mat-sidenav
      #sidenav
      [mode]="mode.value || 'over'"
      style="background-color: aqua"
    >
      <p class="d-flex">
        <button mat-button (click)="sidenav.toggle()"></button>
      </p>

      <button class="drawer-btn" (click)="routeToBuyProduct()">
        {{ "header.buy_watch" | translate }}
      </button>
      <button class="drawer-btn" (click)="routeToNewProduct()">
        {{ "header.sell_watch" | translate }}
      </button>
      <button class="drawer-btn" *ngIf="showHideAdminUser === true" (click)="routeToAdminPannel()">
        {{ "header.admin_pannel" | translate }}
      </button>
      <button class="drawer-btn position-relative">
        {{ "header.new_arrivals" | translate }}
        <span class="toggle-notification-dot" *ngIf="isUserLogin === 'true'"></span>
      </button>

      <button style="background: none; border: none; font-size: 16px" *ngIf="isUserLogin === 'false'" (click)="goToRegister()">
        {{ "header.Login" | translate }}
      </button>
      <button style="background: none; border: none; font-size: 16px" *ngIf="isUserLogin === 'true'" (click)="logout()">
        {{ "header.Logout" | translate }}
      </button>
    </mat-sidenav>

    <mat-sidenav-content class="header-div">
      <div [ngClass]="{ 'lag-logo-stl': isRtl }" class="logo">
        <img class="logo-img" routerLink="/" src="./assets/images/logo.png" alt="Cronosuq" style="cursor: pointer" />
      </div>
      <div class="header-content gap-4" *ngIf="!isSmallScreen && !isSearchForm">
        <button class="custom-btn position-relative">
          {{ "header.new_arrivals" | translate }}
          <span class="notification-dot" *ngIf="isUserLogin === 'true'"></span>
        </button>
        <button class="custom-btn" (click)="routeToBuyProduct()">
          {{ "header.buy_watch" | translate }}
        </button>
        <button class="custom-btn" (click)="routeToNewProduct()">
          {{ "header.sell_watch" | translate }}
        </button>
        <button class="custom-btn" *ngIf="showHideAdminUser === true" (click)="routeToAdminPannel()">
          {{ "header.admin_pannel" | translate }}
        </button>
      </div>
      <div class="header-content gap-4" *ngIf="isSearchForm" [ngClass]="{
          'position-absolute search-box-small-screen': isSmallScreen
        }">
        <form class="d-flex flex-grow-1 ms-3" (ngSubmit)="onSearch(searchQuery)">
          <input [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange()" class="form-control me-2" type="search"
            placeholder="Search through 597,161 watches worldwide" aria-label="Search" />
        </form>
      </div>

      <div class="header-contact gap-4">
        <img src="./assets/images/search-icon.png" (click)="openSearchForm()" style="cursor: pointer" />
        <mat-menu #profileMenu="matMenu">
          <button mat-menu-item *ngIf="isUserLogin === 'false'"(click)="goToRegister()">
            {{ "header.Login" | translate }}
          </button>
          <button mat-menu-item *ngIf="isUserLogin === 'true'" (click)="logout()">
            {{ "header.Logout" | translate }}
          </button>
        </mat-menu>

        <img src="./assets/images/profile-icon.png" alt="Profile" [matMenuTriggerFor]="profileMenu"
          style="cursor: pointer" />

        <button *ngIf="selectedLang === 'en'" class="custom-btn" (click)="useLang('ar')">
          ARB
        </button>
        <button *ngIf="selectedLang === 'ar'" class="custom-btn" (click)="useLang('en')">
          EN
        </button>
      
      <button mat-button (click)="sidenav.toggle()" *ngIf="isSmallScreen">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          viewBox="0 0 448 512"
        >
          <path
            d="M16 132h416c8.837.0 16-7.163 16-16V76c0-8.837-7.163-16-16-16H16C7.163 60 0 67.163.0 76v40c0 8.837 7.163 16 16 16zm0 160h416c8.837.0 16-7.163 16-16v-40c0-8.837-7.163-16-16-16H16c-8.837.0-16 7.163-16 16v40c0 8.837 7.163 16 16 16zm0 160h416c8.837.0 16-7.163 16-16v-40c0-8.837-7.163-16-16-16H16c-8.837.0-16 7.163-16 16v40c0 8.837 7.163 16 16 16z"
          ></path>
        </svg>
        <h1>Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic, obcaecati? Expedita et consequatur placeat tempore! Consequuntur labore nemo accusamus rerum reiciendis harum placeat atque quae quaerat. A labore eveniet necessitatibus!</h1>
      </button>
      
    </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
