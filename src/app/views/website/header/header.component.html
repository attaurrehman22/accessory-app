<div
  class="global-main-wraper"
  style="
    background-color: #fdfbff;
    position: fixed;
    width: 100%;
    z-index: 999;
    top: 0;
  "
>
  <mat-sidenav-container
    class="sidenav-container"
    [ngClass]="{ 'rtl-layout': isRtl }"
  >
    <mat-sidenav
      #drawer
      class="sidenav"
      #sidenav
      mode="over"
      [position]="isRtl && isSmallScreen ? 'start' : 'end'"
      [style]="{ top: '0', right: '0', position: 'fixed', height: 'auto' }"
    >
      <button class="drawer-btn" (click)="routeToBuyProduct()">
        {{ "header.buy_watch" | translate }}
      </button>
      <button class="drawer-btn" (click)="routeToNewProduct()">
        {{ "header.sell_watch" | translate }}
      </button>
      <button
        class="drawer-btn"
        *ngIf="isAdminUser"
        (click)="routeToAdminPannel()"
      >
        {{ "header.admin_pannel" | translate }}
      </button>
      <button class="drawer-btn position-relative">
        {{ "header.new_arrivals" | translate }}
        <span
          class="toggle-notification-dot"
          *ngIf="isUserLogin === 'LogIn'"
        ></span>
      </button>
      <!-- <form
        *ngIf="searchFilter"
        class="d-flex flex-grow-1 ms-3"
        (ngSubmit)="onSearch(searchQuery)"
      >
        <input
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange()"
          class="form-control me-2"
          type="search"
          placeholder="Search through 597,161 watches worldwide"
          aria-label="Search"
        />
      </form> -->

      <button
        style="background: none; border: none; font-size: 16px"
        *ngIf="!isUserLogin"
        (click)="goToRegister()"
      >
        {{ "header.Login" | translate }}
      </button>
      <button
        style="background: none; border: none; font-size: 16px"
        *ngIf="isUserLogin"
        (click)="logout()"
      >
        {{ "header.Logout" | translate }}
      </button>
    </mat-sidenav>

    <mat-toolbar class="header-div">
      <div [ngClass]="{ 'lag-logo-stl': isRtl }" class="logo">
        <img
          class="logo-img"
          routerLink="/"
          src="./assets/images/logo.png"
          alt="Cronosuq"
          style="cursor: pointer"
        />
      </div>
      <div class="header-content gap-4" *ngIf="!isSmallScreen && !isSearchForm">
        <button class="custom-btn position-relative">
          {{ "header.new_arrivals" | translate }}
          <span class="notification-dot" *ngIf="isUserLogin === 'LogIn'"></span>
        </button>
        <button class="custom-btn" (click)="routeToBuyProduct()">
          {{ "header.buy_watch" | translate }}
        </button>
        <button class="custom-btn" (click)="routeToNewProduct()">
          {{ "header.sell_watch" | translate }}
        </button>
        <button
          class="custom-btn"
          *ngIf="isAdminUser"
          (click)="routeToAdminPannel()"
        >
          {{ "header.admin_pannel" | translate }}
        </button>

        <!-- <form
          *ngIf="isSearchForm"
          class="d-flex flex-grow-1 ms-3"
          (ngSubmit)="onSearch(searchQuery)"
        >
          <input
            [(ngModel)]="searchQuery"
            (ngModelChange)="onSearchChange()"
            class="form-control me-2"
            type="search"
            placeholder="Search through 597,161 watches worldwide"
            aria-label="Search"
          />
        </form> -->
      </div>

      <div class="header-content gap-4" *ngIf="isSearchForm">
        <form
          class="d-flex flex-grow-1 ms-3"
          (ngSubmit)="onSearch(searchQuery)"
        >
          <input
            [(ngModel)]="searchQuery"
            (ngModelChange)="onSearchChange()"
            class="form-control me-2"
            type="search"
            placeholder="Search through 597,161 watches worldwide"
            aria-label="Search"
          />
        </form>
      </div>
      <div class="header-contact gap-4">
        <img
          src="./assets/images/search-icon.png"
          (click)="openSearchForm()"
          *ngIf="!isSmallScreen"
          style="cursor: pointer"
        />
        <!-- <img src="./assets/images/fav-icon.png" style="cursor: pointer" /> -->
        <mat-menu #profileMenu="matMenu">
          <button mat-menu-item (click)="goToRegister()">
            {{ "header.Login" | translate }}
          </button>
          <button mat-menu-item (click)="logout()">
            {{ "header.Logout" | translate }}
          </button>
        </mat-menu>

        <img
          src="./assets/images/profile-icon.png"
          alt="Profile"
          [matMenuTriggerFor]="profileMenu"
          style="cursor: pointer"
        />

        <button
          *ngIf="selectedLang === 'en'"
          class="custom-btn"
          (click)="useLang('ar')"
        >
          ARB
        </button>
        <button
          *ngIf="selectedLang === 'ar'"
          class="custom-btn"
          (click)="useLang('en')"
        >
          EN
        </button>

        <button
          mat-icon-button
          class="menu-icon"
          (click)="drawer.toggle()"
          *ngIf="isSmallScreen"
        >
          <mat-icon>menu</mat-icon>
        </button>
      </div>
    </mat-toolbar>
  </mat-sidenav-container>
</div>
