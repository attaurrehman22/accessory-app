<mat-sidenav-container
  class="sidenav-container"
  [ngClass]="{ 'rtl-layout': isRtl }"
>
  <mat-sidenav
    #drawer
    class="sidenav"
    mode="over"
    position="end"
    [style]="{ top: '0', right: '0', position: 'fixed', height: 'auto' }"
  >
    <button class="drawer-btn" (click)="routeToBuyProduct()">
      {{ "header.buy_watch" | translate }}
    </button>
    <button class="drawer-btn" (click)="routeToNewProduct()">
      {{ "header.sell_watch" | translate }}
    </button>
  </mat-sidenav>

  <mat-toolbar class="header-div">
    <div class="logo">
      <img
        class="logo-img"
        routerLink="/"
        src="./assets/images/logo.png"
        alt="Cronosuq"
      />
    </div>
    <div class="header-content gap-4" *ngIf="!isSmallScreen">
      <button class="custom-btn" (click)="routeToBuyProduct()">
        {{ "header.buy_watch" | translate }}
      </button>
      <button class="custom-btn" (click)="routeToNewProduct()">
        {{ "header.sell_watch" | translate }}
      </button>
    </div>
    <div class="header-contact gap-4">
      <!-- <img src="./assets/images/basket-icon.png" /> -->
      <!-- <img
        src="./assets/images/profile-icon.png"
        style="cursor: pointer"
        [matMenuTriggerFor]="menu"
        (click)="$event.stopPropagation()"
      />

      <mat-menu #menu="matMenu">
        <button mat-menu-item>
          <mat-icon>edit</mat-icon>
          <span>Edit</span>
        </button>
        <button mat-menu-item>
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
        <button mat-menu-item>
          <mat-icon>refresh</mat-icon>
          <span>Reset Password</span>
        </button>
      </mat-menu> -->

      <mat-icon style="cursor: pointer;" (click)="logout()" *ngIf="isUserLogin">logout<span>logout</span></mat-icon>
      <!-- <img
      *ngIf="isUserLogin"
      src="./assets/images/profile-icon.png"
      (click)="logout()"
      style="cursor: pointer;"
    /> -->
     <img
      *ngIf="!isUserLogin"
      src="./assets/images/profile-icon.png"
      (click)="goToRegister()"
      style="cursor: pointer;"
    />
      <div class="dropdown">
        <select (change)="useLang($event.target.value)">
          <option *ngFor="let item of supportLanguages" [value]="item.value">
            {{ item.name }}
          </option>
        </select>
      </div>

      <button
        mat-icon-button
        class="menu-icon"
        (click)="drawer.toggle()"
        *ngIf="isSmallScreen"
      >
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </mat-toolbar>
</mat-sidenav-container>
