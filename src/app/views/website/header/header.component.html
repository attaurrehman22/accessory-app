<div class="global-main-wraper"  style="background-color: #fdfbff;">
  <mat-sidenav-container
    class="sidenav-container"
    [ngClass]="{ 'rtl-layout': isRtl }"
  >
    <mat-sidenav
      #drawer
      class="sidenav"
      #sidenav
      mode="over"
      position="end"
      [style]="{ top: '0', right: '0', position: 'fixed', height: 'auto' }"
    >
      <button class="drawer-btn" (click)="routeToBuyProduct()">
        {{ "header.buy_watch" | translate }}
      </button>
      <button class="drawer-btn" (click)="routeToNewProduct()">
        {{ "header.sell_watch" | translate }}
      </button>

      <form *ngIf="searchFilter" class="d-flex flex-grow-1 ms-3" (ngSubmit)="onSearch(searchQuery)">
        <input
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange()"
          class="form-control me-2"
          type="search"
          placeholder="Search through 597,161 watches worldwide"
          aria-label="Search"
        />
      </form>

      <button
        style="background: none; border: none; font-size: 16px"
        *ngIf="!isUserLogin"
        (click)="goToRegister()"
      >
        Login
      </button>

      <!-- <img
      *ngIf="!isUserLogin"
      src="./assets/images/profile-icon.png"
      (click)="goToRegister()"
      style="cursor: pointer"
    /> -->
      <button
        style="background: none; border: none; font-size: 16px"
        *ngIf="isUserLogin"
        (click)="logout()"
      >
        Logout
      </button>
    </mat-sidenav>

    <mat-toolbar class="header-div" >
      <div [ngClass]="{ 'lag-logo-stl': isRtl }" class="logo">
        <img
          class="logo-img"
          routerLink="/"
          src="./assets/images/logo.png"
          alt="Cronosuq"
          style="cursor: pointer"
        />
      </div>
      <div class="header-content gap-4" *ngIf="!isSmallScreen">

        <form *ngIf="searchFilter" class="d-flex flex-grow-1 ms-3" (ngSubmit)="onSearch(searchQuery)">
          <input
            [(ngModel)]="searchQuery"
            (ngModelChange)="onSearchChange()"
            class="form-control me-2"
            type="search"
            placeholder="Search through 597,161 watches worldwide"
            aria-label="Search"
          />
        </form>

        <button class="custom-btn" (click)="routeToBuyProduct()">
          {{ "header.buy_watch" | translate }}
        </button>
        <button class="custom-btn" (click)="routeToNewProduct()">
          {{ "header.sell_watch" | translate }}
        </button>
      </div>
      <div class="header-contact gap-4">
        <button
          style="background: none; border: none; font-size: 16px"
          *ngIf="isUserLogin && !isSmallScreen"
          (click)="logout()"
        >
          Logout
        </button>
        <!-- <mat-icon style="cursor: pointer">notification_important</mat-icon> -->
        <img
          *ngIf="!isUserLogin && !isSmallScreen"
          src="./assets/images/profile-icon.png"
          (click)="goToRegister()"
          style="cursor: pointer"
        />
        <div class="dropdown">
          <select
            [(ngModel)]="selectedLang"
            (change)="useLang($event.target.value)"
          >
            <option *ngFor="let item of supportLanguages" [value]="item.value">
              {{ item.name }}
            </option>
          </select>
        </div>

        <button
          mat-icon-button
          class="menu-icon"
          (click)="drawer.toggle()"
          *ngIf="isSmallScreen"
        >
          <mat-icon>menu</mat-icon>
        </button>
      </div>
    </mat-toolbar>
  </mat-sidenav-container>
</div>
