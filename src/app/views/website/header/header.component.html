<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    mode="over"
    position="end"
    [style]="{ top: '0', right: '0', position: 'fixed', height: 'auto' }"
  >
    <button class="drawer-btn" routerLink="/">Buy a watch</button>
    <button class="drawer-btn" routerLink="/">Sell a watch</button>
    <button class="drawer-btn" routerLink="/">Magazine</button>
    <button class="drawer-btn" routerLink="/">Watch Collection</button>
    <button class="drawer-btn" routerLink="/">ChronoPulse</button>
    <button class="drawer-btn" routerLink="/">FAQ</button>
    <button class="drawer-btn" routerLink="/">Security</button>
  </mat-sidenav>

  <mat-toolbar class="header-div">
    <div class="logo">
      <img class="logo-img" routerLink="/" src="./assets/images/logo.png" alt="Cronosuq" />
    </div>
    <div class="header-content gap-4" *ngIf="!isSmallScreen">
      <button class="custom-btn" routerLink="/">Buy a watch</button>
      <button class="custom-btn" routerLink="/">Sell a watch</button>
      <button class="custom-btn" routerLink="/">Magazine</button>
      <button class="custom-btn" routerLink="/">Watch Collection</button>
      <button class="custom-btn" routerLink="/">ChronoPulse</button>
      <button class="custom-btn" routerLink="/">FAQ</button>
      <button class="custom-btn" routerLink="/">Security</button>
    </div>
    <div class="header-contact gap-4">
      <img src="./assets/images/basket-icon.png" />
      <img src="./assets/images/profile-icon.png" />
      <button mat-icon-button class="menu-icon" (click)="drawer.toggle()" *ngIf="isSmallScreen">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </mat-toolbar>
</mat-sidenav-container>
