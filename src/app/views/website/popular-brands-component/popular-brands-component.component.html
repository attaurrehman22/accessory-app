<div class="container-div">
  <div
    class="col-lg-12 col-md-12 col-sm-12 d-flex flex-wrap"
    [ngClass]="{ 'reverse-order': translateService.currentLang !== 'en' }"
  >
    <div class="col-lg-6 col-md-12 col-sm-12">
      <div
        class="container mt-5"
        [ngClass]="{
          'reverse-order-labels': translateService.currentLang !== 'en'
        }"
      >
        <p class="header-label">
          {{ "popular_brands.label" | translate }}
        </p>
        <p
          class="mb-4 font-size-20 font-wight-400 color-6a6a6a"
        >
          {{ "popular_brands.paragraph" | translate }}
        </p>

        <div class="w-100 d-flex">
          <button class="btn btn-dark btn-lg mb-5" style="width: 200px">
            {{ "popular_brands.view_listing" | translate }}
          </button>
        </div>
        <div
          class="countdown-timer"
          [ngClass]="{
            'reverse-order-time': translateService.currentLang !== 'en'
          }"
        >
          <p
            class="mb-4 font-size-24 font-wight-400 color-484848"
          >
            {{ "popular_brands.hurry_up" | translate }}
          </p>
          <div class="d-flex gap-2">
            <div class="d-flex flex-column">
              <div class="timer-box">
                <span class="display-4">{{ days }}</span>
              </div>
              <p class="text-center">Days</p>
            </div>
            <div class="d-flex flex-column">
              <div class="timer-box">
                <span class="display-4">{{ hours }}</span>
              </div>
              <p class="text-center">Hrs</p>
            </div>
            <div class="d-flex flex-column">
              <div class="timer-box">
                <span class="display-4">{{ minutes }}</span>
              </div>
              <p class="text-center">Mins</p>
            </div>
            <div class="d-flex flex-column">
              <div class="timer-box">
                <span class="display-4">{{ seconds }}</span>
              </div>
              <p class="text-center">Sec</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-6 col-md-12 col-sm-12">
      <div class="container mt-5">
        <p-carousel
          [autoplayInterval]="4000"
          [value]="products"
          [numVisible]="3"
          [numScroll]="1"
          [responsiveOptions]="responsiveOptions"
          [circular]="true"
          (onPage)="onCarouselMove($event)"
        >
          <ng-template let-product let-i="index" pTemplate="item">
            <div class="surface-border border-round m-1" style="cursor: pointer;" (click)="logProductName(product.product)">
              <div class="mb-3">
                <div class="relative mx-auto">
                  <img
                    
                    [src]="
                      'https://api.chronosouq.com/' + product.promotion_banner
                    "
                    [alt]="product.name"
                    class="w-full border-round card-img img-fluid"
                    
                  />
                  <div class="img-details">
                    <div class="d-flex">
                      <p class="font-size-16 font-wight-400 color-484848">
                        {{ product.product.condition }}
                      </p>
                    </div>
                    <div class="d-flex">
                      <p class="font-size-16 font-wight-400 color-484848">
                        {{ product.product.name }}
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </ng-template>
        </p-carousel>
      </div>
    </div>
  </div>
</div>
