<div class="container-div mb-3" *ngIf="sliderImages && sliderImages.length > 0">
  <div
    class="col-lg-12 col-md-12 col-sm-12 d-flex flex-wrap"
    [ngClass]="{ 'reverse-order': translateService.currentLang !== 'en' }"
  >
    <div class="col-lg-6 col-md-12 col-sm-12">
      <div
        class="container mt-5"
        [ngClass]="{
          'reverse-order-labels': translateService.currentLang !== 'en'
        }"
      >
        <p class="header-label cormorant-styl">
          {{ "popular_brands.label" | translate }}
        </p>
        <p
          class="mb-4 font-size-20 font-wight-400 color-6a6a6a"
        >
          {{ "popular_brands.paragraph" | translate }}
        </p>

        <div class="w-100 d-flex">
          <a [routerLink]="['/product-list']" [queryParams]="{ name: 'featured' }" class="btn btn-dark btn-lg mb-5" style="width: 200px">
            {{ "popular_brands.view_listing" | translate }}
          </a>
        </div>
        <div
          class="countdown-timer"
          [ngClass]="{
            'reverse-order-time': translateService.currentLang !== 'en'
          }"
        >
          <p
            class="mb-4 font-size-24 font-wight-400 color-484848"
          >
            {{ "popular_brands.hurry_up" | translate }}
          </p>

          <div class="d-flex gap-2">
            <div class="d-flex flex-column">
              <div class="timer-box">
                <span class="display-4">{{ days }}</span>
              </div>
              <p class="text-center">Days</p>
            </div>
            <div class="d-flex flex-column">
              <div class="timer-box">
                <span class="display-4">{{ hours }}</span>
              </div>
              <p class="text-center">Hrs</p>
            </div>
            <div class="d-flex flex-column">
              <div class="timer-box">
                <span class="display-4">{{ minutes }}</span>
              </div>
              <p class="text-center">Mins</p>
            </div>
            <div class="d-flex flex-column">
              <div class="timer-box">
                <span class="display-4">{{ seconds }}</span>
              </div>
              <p class="text-center">Sec</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-6 col-md-12 col-sm-12">
      <div class="container mt-5">
          <ng-image-slider 
            #imageSlider
            [images]="sliderImages"
            [infinite]="true"
            [imageSize]="{width: 300, height: 270}"
            [autoSlide]="{interval: 5, stopOnHover: true}" 
            [showArrow]="true"
            [showDots]="true"
            [showPreview]="false"
            [slideImageCount]="3"
            (imageClick)="onImageClick($event)"
            (arrowClick)="onSlideChange($event)"
            class="custom-slider">
          </ng-image-slider>
      </div>
    </div>
  </div>
</div>

<!-- [autoSlide]="{interval: 5, stopOnHover: true}" -->
