<div class="container-div">
  <div
    class="col-lg-12 col-md-12 col-sm-12 d-flex flex-wrap"
    [ngClass]="{ 'reverse-order': translateService.currentLang !== 'en' }"
  >
    <div class="col-lg-5 col-md-12 col-sm-12">
      <div
        class="container mt-5"
        [ngClass]="{
          'reverse-order-labels': translateService.currentLang !== 'en'
        }"
      >
        <h2 class="fw-bold">
          {{ "popular_brands.label" | translate }}
        </h2>
        <p class="mb-4">
          {{ "popular_brands.paragraph" | translate }}
        </p>

        <div class="w-100 d-flex">
          <button class="btn btn-dark btn-lg mb-5">
            {{ "popular_brands.view_listing" | translate }}
          </button>
        </div>
        <div
          class="countdown-timer"
          [ngClass]="{
            'reverse-order-time': translateService.currentLang !== 'en'
          }"
        >
          <h5 class="mb-4">
            {{ "popular_brands.hurry_up" | translate }}
          </h5>
          <div class="d-flex gap-2">
            <div class="timer-box">
              <span class="display-4">{{ days }}</span>
              <p>Days</p>
            </div>
            <div class="timer-box">
              <span class="display-4">{{ hours }}</span>
              <p>Hrs</p>
            </div>
            <div class="timer-box">
              <span class="display-4">{{ minutes }}</span>
              <p>Mins</p>
            </div>
            <div class="timer-box">
              <span class="display-4">{{ seconds }}</span>
              <p>Sec</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-7 col-md-12 col-sm-12">
      <div class="container mt-5">
        <p-carousel
          [autoplayInterval]="2000"
          [value]="products"
          [numVisible]="3"
          [numScroll]="1"
          [responsiveOptions]="responsiveOptions"
          [circular]="true"
          (onPage)="onCarouselMove($event)"
        >
          <ng-template let-product let-i="index" pTemplate="item">
            <div
              class="surface-border border-round m-1"
              [ngClass]="{
                'first-product': i === firstVisibleIndex,
                'other-products': i !== firstVisibleIndex
              }"
            >
              <div class="mb-3">
                <div class="relative mx-auto">
                  <img
                    src="https://primefaces.org/cdn/primeng/images/demo/product/{{
                      product.image
                    }}"
                    [alt]="product.name"
                    class="w-full border-round"
                  />
                  <!-- <p-tag
                    [value]="product.inventoryStatus"
                    [severity]="getSeverity(product.inventoryStatus)"
                    class="absolute"
                    [ngStyle]="{ 'left.px': 5, 'top.px': 5 }"
                  ></p-tag> -->
                </div>
              </div>
            </div>
          </ng-template>
        </p-carousel>
      </div>
    </div>
  </div>
</div>
