<div
  class="global-main-wraper d-flex flex-wrap justify-content-between mt-5 mb-5"
  [ngClass]="{ 'reverse-order': translateService.currentLang !== 'en' }"
>
  <div class="container-fluid list-data">
    <div class="col-lg-12 col-md-12 col-sm-12 d-flex justify-content-between align-items-center">
      <p class="text-center font-size-28 font-wight-600 color-242424">
        Watch Listing
      </p>
      <!-- <p class="text-center font-size-40 font-wight-600 color-484848">
        Filters
      </p> -->
      <button style="border-radius: 10px;border: 1px solid black;background: none;height: 50px;width: 150px;display: flex;justify-content: space-around;align-items: center;" (click)="openFilters()">
        <img src="../assets/images/hugeicons_filter.png" />
        Filters
        <img src="../assets/images/FiChevronDown.png" />
      </button>
    </div>
    <div *ngIf="isShowFilters" class="filter-Div p-3 border rounded">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-3">Filters</h5>
        <button style="border: none;background: none;color: #242424;" (click)="clearFilters()">Clear Filters</button>
      </div>
        <!-- Categories Section -->
        <div class="mb-4 border-bottom-color">
          <p class="font-size-16 font-wight-600 color-242424 margin-0">Categories</p>
          <div class="row">
            <div class="col-4" *ngFor="let category of categories | slice :0:8">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  [id]="category.id"
                  [(ngModel)]="category.selected"
                />
                <label class="form-check-label" [for]="category.id">
                  {{ category.name }}
                </label>
              </div>
            </div>
          </div>
        </div>
      
        <!-- Watch Type Section -->
        <div class="mb-4 border-bottom-color">
          <p class="font-size-16 font-wight-600 color-242424 margin-0">Watch Type</p>
          <div class="row">
            <div class="col-4" *ngFor="let type of watchTypes| slice :0:8">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  [id]="type.id"
                  [(ngModel)]="type.selected"
                />
                <label class="form-check-label" [for]="type.id">
                  {{ type.name }}
                </label>
              </div>
            </div>
          </div>
        </div>
      
        <!-- Price Range Section -->
        <div class="mb-4">
          <p class="font-size-16 font-wight-600 color-242424 margin-0">Price Range</p>
          <div class="d-flex align-items-center">
            <input
              type="number"
              class="form-control me-2"
              placeholder="From"
              [(ngModel)]="priceRange.from"
            />
            <input
              type="number"
              class="form-control"
              placeholder="To"
              [(ngModel)]="priceRange.to"
            />
          </div>
        </div>  
      
        <!-- Apply Filters Button -->
        <button class="btn btn-dark w-100 custom-apply-filter-btn" (click)="applyFilters()">
          Apply Filters
        </button>
    
      
    </div>

    <div class="container-fluid mt-3">
      <div class="row">
        <div class="col-md-3 col-sm-6 mb-4" *ngFor="let watch of showList">
          <div class="card h-100 shadow-sm">
            <a
            [routerLink]="['/buy-product']"
            [queryParams]="{ id: watch.id }"
              class="card-img-link"
          >
            <img
              style="cursor: pointer;"
              [src]="'https://api.chronosouq.com/' + watch.main_image"
              class="card-img-top"
              alt="watch image"
            />
            </a>
            <div class="card-body">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <div>
                  <p class="font-size-16 font-wight-400 color-6a6a6a"
                    style="
                      margin: 0 !important;
                    "
                  >
                    {{ watch.brand.name }} | {{watch.model || 'N/A'}}
                  </p>
                </div>
                <div>
                  <i class="fa fa-heart-o" aria-hidden="true"></i>
                </div>
              </div>
              <div
                class="d-flex justify-content-between align-items-center mt-2"
              >
                <p class="card-title d-flex flex-wrap">
                  {{ watch.title }}
                </p>
              </div>
              <div
                class="d-flex justify-content-between align-items-center mt-3"
              >
                <p class="price">
                  +{{ watch.shipping_charges }} {{ watch.currency }} Shipping
                </p>
                <div>
                  <p class="price">Location</p>
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center">
                <p class="card-title-two">{{ watch.price }}</p>
                <p class="card-title-two">{{ watch.created_by.city }}</p>
              </div>
              <div *ngIf="watch.created_by.type === 'user'" class="d-flex mt-2 seller-chip">
                Private Seller
              </div>
              <div *ngIf="watch.created_by.type === 'dealer'" class="d-flex mt-2 seller-chip">
                Dealer
              </div>
            </div>
          </div>
          <div class="heart-icon">
            <div class="featured-icon">
              <div *ngIf="watch.feature_item === 1">
              featured
            </div>
            </div>
            <i
            *ngIf="isUserLogin ==='true'"
            (click)="addWishList(watch)"
              class="fa"
              [ngClass]="wishList.includes(watch.id) ? 'fa-heart' : 'fa-heart fa-heart-o'"
              aria-hidden="true"
            ></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
