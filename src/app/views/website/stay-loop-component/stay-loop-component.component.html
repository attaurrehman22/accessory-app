<div
  class="container-fluid d-flex justify-content-center align-items-center vh-50 mt-5 mb-5 mt-5"
>
  <div
    class="row w-100"
    [ngStyle]="{
      'background-color':
        translateService.currentLang === 'en' ? '#f8f8f8' : '#333333'
    }"
    [ngClass]="{ 'reverse-order': translateService.currentLang !== 'en' }"
  >
    <div class="col-12 col-md-6 bg-left">
      <div
        [ngClass]="{
          'reverse-order-res-img': translateService.currentLang !== 'en'
        }"
      >
        <img
          src="../../../../assets/images/watch.png"
          alt=""
          style="width: 100%"
        />
      </div>
    </div>
    <div class="col-12 col-md-6 position-relative bg-right">
      <div class="watch-details-div">
        <div class="d-flex flex-column text-white">
          <p class="mb-1">Chronosouq Hand Picked</p>
          <h1 class="display-6 fw-bold mt-2">SpeedMaster</h1>
          <p class="card-text">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Scelerisque
            duis ultrices sollicitudin aliquam sem. Lorem ipsum dolor sit amet,
            consectetur adipiscing elit. Scelerisque duis.
          </p>

          <div class="mb-3">
            <span class="fw-bold">Type:</span>
            <span class="badge bg-light p-2 text-dark mx-2"
              >Limited Edition</span
            >
          </div>

          <h4>SAR 2,400.69</h4>

          <button class="buy-btn">Buy Now</button>
        </div>
      </div>
    </div>
  </div>
</div>
