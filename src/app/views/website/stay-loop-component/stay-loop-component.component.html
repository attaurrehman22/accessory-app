<div class="wraper mt-3">
  <div class="subscribe-container">
    <div class="subscribe-content">
      <h2 class="subscribe-title">{{ 'stay_loop.label' | translate }}</h2>
      <p class="subscribe-description">
        {{ 'stay_loop.paragraph' | translate }}
      </p>
    </div>
    <div class="subscribe-form">
      <input
        type="email"
        placeholder="{{ 'stay_loop.enter_email' | translate }}"
        class="subscribe-input"
      />
      <button class="subscribe-button">{{ 'stay_loop.continue' | translate }}</button>
    </div>
  </div>
</div>
