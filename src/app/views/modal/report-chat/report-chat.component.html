<div class="report-chat-container mat-elevation-z3">
  <div class="col-md-12 d-flex flex-wrap">
    <div class="col-md-12">
      <h2>Report Chat</h2>
      <p>Report an issue with this conversation</p>
    </div>
  </div>

  <form [formGroup]="reportForm" (ngSubmit)="onSubmit()" class="mt-3 mat-form-fields-custom-deisgn">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Report Type</mat-label>
      <mat-select formControlName="reportType">
        <mat-option *ngFor="let type of reportTypes" [value]="type.value">
          {{ type.label }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="reportForm.get('reportType')?.hasError('required')">
        Report type is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" *ngIf="!data.chatId">
      <mat-label>Order ID (Optional)</mat-label>
      <input matInput type="text" formControlName="orderId" placeholder="Enter order ID if applicable" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" *ngIf="!data.chatId">
      <mat-label>Reported User ID</mat-label>
      <input matInput type="text" formControlName="reportedUserId" [readonly]="true" />
      <mat-error *ngIf="reportForm.get('reportedUserId')?.hasError('required')">
        Reported user ID is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width description-field">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        formControlName="description"
        rows="4"
        placeholder="Please provide a detailed explanation of the issue"
      ></textarea>
      <mat-error *ngIf="reportForm.get('description')?.hasError('required')">
        Description is required
      </mat-error>
      <mat-error *ngIf="reportForm.get('description')?.hasError('minlength')">
        Description must be at least 10 characters
      </mat-error>
    </mat-form-field>

    <div class="file-upload-section">
      <label class="file-upload-label">Attachments (Screenshots/Documents)</label>
      <input
        #fileInput
        type="file"
        multiple
        accept="image/*,.pdf,.doc,.docx"
        (change)="onFileSelected($event)"
        style="display: none"
      />
      <button
        type="button"
        (click)="uploadFiles()"
        class="upload-btn"
        style="
          background: none;
          border: 1px solid #242424;
          border-radius: 10px;
          color: #242424;
          height: 40px;
          width: 150px;
          cursor: pointer;
        "
      >
        Choose Files
      </button>
      
      <div *ngIf="selectedFiles.length > 0" class="selected-files mt-2">
        <div *ngFor="let file of selectedFiles; let i = index" class="file-item">
          <span>{{ file.name }}</span>
          <button
            type="button"
            (click)="removeFile(i)"
            class="remove-file-btn"
            style="
              background: none;
              border: none;
              color: #ff0000;
              cursor: pointer;
              margin-left: 10px;
            "
          >
            ×
          </button>
        </div>
      </div>
    </div>

    <div class="action-buttons mt-3">
      <button (click)="onCancel()" type="button" class="cancel-btn">
        Cancel
      </button>
      <button class="send-btn" type="submit" [disabled]="reportForm.invalid">
        Submit Report
      </button>
    </div>
  </form>
</div>
