<div class="container py-4">
    <div class="row">
        <h5 class="fw-bold">Shopping Cart</h5>
        <p class="text-muted">Confirm your order before adding it to cart.</p>
    
        <div class="card mb-3" style="border: 2px solid #F5F5F5;border-radius: 12px;">
        <div class="row g-2 align-items-center">
            <div class="col-auto">
            <img src="assets/images/python-skin.png" class="img-fluid" alt="Product Image" style="width: 60px;">
            </div>
            <div class="col">
            <div class="fw-bold">Python Skin - Slate Grey</div>
            <div class="text-muted small">#123456</div>
            </div>
        </div>
        </div>
    
        <div class="mb-2">
        <label class="fw-bold d-block">LUG Width</label>
        <button class="btn btn-dark btn-sm">Apple 38/40/41MM</button>
        </div>
    
        <div class="mb-2">
        <label class="fw-bold d-block">Buckle/Connector</label>
        <button class="btn btn-dark btn-sm">Black</button>
        </div>
    
        <div class="mb-2">
        <label class="fw-bold d-block">Length</label>
        <button class="btn btn-dark btn-sm">Small 115/75MM</button>
        </div>
    
        <div class="mb-2">
        <label class="fw-bold d-block">Color</label>
        <div class="rounded border" style="width: 40px; height: 25px; background-color: #9c9ea2;"></div>
        </div>
    
        <div class="mb-4">
        <label class="fw-bold d-block">Quantity</label>
        <input type="number" class="form-control w-25" min="1" value="1">
        </div>
    </div>
    <div class="d-grid gap-2">
      <button class="btn btn-dark">Checkout</button>
      <button class="btn btn-outline-dark">View Cart</button>
    </div>
  </div>
