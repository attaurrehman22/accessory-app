<div class="sideBar" [ngStyle]="{ width: toogle == false ? '80px' : '240px' }">
  <div class="card">
    <div class="toogle-menu pointer" (click)="onToogleHandler()">
      <mat-icon>menu</mat-icon>
    </div>
    <div class="toogle-menu1 pointer">
      <h2>ChronoSouq</h2>
    </div>
    <div class="largeSize">
      <button
        [title]="navItems.dashboard.label"
        class="btn2"
        [routerLink]="navItems.dashboard.router"
        [routerLinkActive]="navItems.dashboard.routerActive"
      >
        <img
          [src]="navItems.dashboard.icon"
          [width]="navItems.dashboard.iconWidth"
          [height]="navItems.dashboard.iconHeight"
        />
        <span *ngIf="toogle"> Dashboard </span>
      </button>

      <button
        class="btn2"
        [title]="navItems.Products.label"
        [routerLink]="navItems.Products.router"
        [ngClass]="
          isActive('/admin-products') || isActive('/admin-add-product')
            ? navItems.Products.routerActive
            : ''
        "
      >
        <img
          [src]="navItems.Products.icon"
          [width]="navItems.Products.iconWidth"
          [height]="navItems.Products.iconHeight"
        />
        <span *ngIf="toogle"> Products </span>
      </button>

      <button
        class="btn2"
        [title]="navItems.Brands.label"
        [routerLink]="navItems.Brands.router"
        [ngClass]="
          isActive('/admin-brands') || isActive('/admin-brands-product')
            ? navItems.Brands.routerActive
            : ''
        "
      >
        <img
          [src]="navItems.Brands.icon"
          [width]="navItems.Brands.iconWidth"
          [height]="navItems.Brands.iconHeight"
        />
        <span *ngIf="toogle"> Brands </span>
      </button>

      <button
        class="btn2"
        [title]="navItems.Category.label"
        [routerLink]="navItems.Category.router"
        [ngClass]="
          isActive('/admin-category') || isActive('/admin-category-product')
            ? navItems.Category.routerActive
            : ''
        "
      >
        <img
          [src]="navItems.Category.icon"
          [width]="navItems.Category.iconWidth"
          [height]="navItems.Category.iconHeight"
        />
        <span *ngIf="toogle"> Category </span>
      </button>
    </div>
  </div>
</div>
