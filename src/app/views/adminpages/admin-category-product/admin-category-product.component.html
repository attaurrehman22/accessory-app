<form [formGroup]="form" class="mt-5">
  <mat-dialog-content>
    <h2 class="d-flex justify-content-center">Category</h2>
    <div class="row mt-4">
      <div class="col-md-6">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Category Name</mat-label>
          <input matInput placeholder="" formControlName="name" />
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Slug</mat-label>
          <input matInput formControlName="slug" />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Parent Id</mat-label>
          <input type="text" matInput formControlName="parent_id" />
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Description</mat-label>
          <input type="text" matInput formControlName="description" />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Meta Title</mat-label>
          <input type="text" matInput formControlName="meta_title" />
        </mat-form-field>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Meta Description</mat-label>
          <input type="text" matInput formControlName="meta_description" />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <input
          style="border: 1px solid black; padding: 5px; width: 100%"
          type="file"
          value="fileName"
          (change)="onFileSelected($event)"
          accept="image/*"
        />
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" style="width: 100%">
          <mat-label>Meta Keywords</mat-label>
          <input type="text" matInput formControlName="meta_keywords" />
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <mat-checkbox formControlName="is_active"> Active</mat-checkbox>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="d-flex gap-2 justify-content-center">
    <button class="save-btn" *ngIf="paramval === 'Create'" (click)="save()">Submit</button>
    <button class="save-btn" *ngIf="paramval === 'Edit'" (click)="save()">Update</button>

    <button class="cancel-btn" (click)="cancel()">Cancel</button>
  </mat-dialog-actions>
</form>
