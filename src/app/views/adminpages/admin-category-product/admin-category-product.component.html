<form [formGroup]="form" class="mt-5">
    <mat-dialog-content>
      <h2 class="d-flex justify-content-center">Category</h2>
      <div class="row">
        <div class="col-md-6">
          <mat-form-field appearance="outline" style="width: 100%">
            <input matInput placeholder="Product Name" formControlName="name" />
            <mat-error
              *ngIf="name.hasError('name') && !name.hasError('required')"
            >
              Please enter a valid name
            </mat-error>
            <mat-error *ngIf="name.hasError('required')">
              Name is required
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field appearance="outline" style="width: 100%">
            <input matInput placeholder="Brand Name" formControlName="userName" />
            <mat-error
              *ngIf="userName.hasError('name') && !userName.hasError('required')"
            >
              Please enter a valid User Name
            </mat-error>
            <mat-error *ngIf="userName.hasError('required')">
              User name is required
            </mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <mat-form-field appearance="outline" style="width: 100%">
            <input
              type="email"
              matInput
              placeholder="Email"
              formControlName="email"
            />
            <mat-error
              *ngIf="email.hasError('name') && !email.hasError('required')"
            >
              Please enter a valid email
            </mat-error>
            <mat-error *ngIf="email.hasError('required')">
              Email is required
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-md-6">
          <mat-form-field appearance="outline" style="width: 100%">
            <input
              type="password"
              matInput
              placeholder="Password"
              formControlName="password"
            />
            <mat-error
              *ngIf="
                password.hasError('password') && !password.hasError('required')
              "
            >
              Please enter a valid password
            </mat-error>
            <mat-error *ngIf="password.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <mat-form-field appearance="outline" style="width: 100%">
            <mat-label>Status</mat-label>
            <mat-select formControlName="active" name="active">
              <mat-option *ngFor="let user of activeUser" [value]="user.value">
                {{ user.viewValue }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </mat-dialog-content>
  
    <mat-dialog-actions class="d-flex gap-2 justify-content-center">
      <button class="save-btn" (click)="save()">Submit</button>
      <button class="cancel-btn" (click)="cancel()">Cancel</button>
    </mat-dialog-actions>
  </form>
