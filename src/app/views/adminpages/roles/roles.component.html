<div class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Roles Management</h3>

            <div class="card-tools">
              <button
                class="btn btn-primary btn-sm mr-2"
                [hidden]="!doPermissionCheck(rolesCreatePermission)"
                (click)="createRole()"
              >
                <i class="fas fa-plus"></i> Add Role
              </button>
              <div
                class="input-group input-group-sm"
                style="width: 200px; display: inline-flex"
              >
                <input
                  type="text"
                  class="form-control float-right"
                  placeholder="Search roles..."
                  (keyup)="applyFilter($event)"
                  #input
                />
                <div class="input-group-append">
                  <button type="button" class="btn btn-default">
                    <i class="fas fa-search"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <!-- /.card-header -->
          <div class="card-body table-responsive p-0">
            <table
              mat-table
              [dataSource]="dataSource"
              matSort
              class="table table-hover text-nowrap"
            >
              <!-- ID Column -->
              <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                <td mat-cell *matCellDef="let row">{{ row.id }}</td>
              </ng-container>

              <!-- Name Column -->
              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Role Name
                </th>
                <td mat-cell *matCellDef="let row">
                  <strong>{{ row.name }}</strong>
                </td>
              </ng-container>

              <!-- Permissions Column -->
              <ng-container matColumnDef="permissions">
                <th mat-header-cell *matHeaderCellDef>Permissions</th>
                <td mat-cell *matCellDef="let row">
                  <span class="badge badge-info">{{
                    row.permissions.length || 0
                  }}</span>
                </td>
              </ng-container>

              <!-- Created Date Column -->
              <ng-container matColumnDef="created_at">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Created Date
                </th>
                <td mat-cell *matCellDef="let row">
                  {{ row.created_at | date : "medium" }}
                </td>
              </ng-container>

              <!-- Updated Date Column -->
              <ng-container matColumnDef="updated_at">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Last Updated Date
                </th>
                <td mat-cell *matCellDef="let row">
                  {{ row.updated_at | date : "medium" }}
                </td>
              </ng-container>

              <!-- Actions Column -->
              <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let row">
                  <button
                    mat-icon-button
                    [hidden]="!doPermissionCheck(rolesUpdatePermission)"
                    class="btn-action btn-edit"
                    (click)="editRole(row)"
                    matTooltip="Edit Role"
                  >
                    <mat-icon>edit</mat-icon>
                  </button>
                  <button
                    mat-icon-button
                    [hidden]="!doPermissionCheck(rolesDeletePermission)"
                    class="btn-action btn-delete"
                    (click)="deleteRole(row)"
                    matTooltip="Delete Role"
                  >
                    <mat-icon>delete</mat-icon>
                  </button>
                </td>
              </ng-container>

              <!-- Table Rows -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

              <!-- No Data Row -->
              <tr class="mat-row" *matNoDataRow>
                <td
                  class="mat-cell text-center text-muted py-4"
                  [attr.colspan]="displayedColumns.length"
                >
                  <span *ngIf="input.value"
                    >No roles matching the filter "{{ input.value }}"</span
                  >
                  <span *ngIf="!input.value">No roles available</span>
                </td>
              </tr>
            </table>
          </div>
          <!-- /.card-body -->
          <div class="card-footer clearfix">
            <mat-paginator
              #paginator
              [length]="totalRecords"
              [pageSize]="pageSize"
              [pageIndex]="pageIndex"
              [pageSizeOptions]="[5, 10, 20, 50]"
              showFirstLastButtons
            ></mat-paginator>
          </div>
        </div>
        <!-- /.card -->
      </div>
    </div>
  </div>
</div>
