
<form [formGroup]="attributeForm" class="mt-3">
  <mat-dialog-content style="min-height: 520px">
    <h2 class="d-flex justify-content-center">
      {{ paramVal }} Attribute
    </h2>
    
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Attribute Type</mat-label>
       <mat-select formControlName="attribute_type_id">
        <mat-option *ngFor="let item of attributeTypeList" [value]="item.id">{{item.type}}</mat-option>
       </mat-select>
      <mat-error *ngIf="attributeForm.get('attribute_type_id')?.hasError('required')">
        Attribute Id is required
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Order</mat-label>
      <input matInput type="number" formControlName="order" min="0" />
      <mat-error *ngIf="attributeForm.get('order')?.hasError('required')">
        Order is required
      </mat-error>
      <mat-error *ngIf="attributeForm.get('order')?.hasError('min')">
        Minimum value is 0
      </mat-error>
      <mat-error *ngIf="attributeForm.get('order')?.hasError('max')">
        Maximum value is 1000
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="attributeForm.get('name')?.hasError('required')">
        Value is required
      </mat-error>
      <mat-error *ngIf="attributeForm.get('name')?.hasError('minlength')">
        Minimum 3 characters
      </mat-error>
      <mat-error *ngIf="attributeForm.get('name')?.hasError('maxlength')">
        Maximum 50 characters
      </mat-error>
    </mat-form-field>

    <div formArrayName="values" class="mt-4">
  <h4>Attribute Values</h4>
  <div
    *ngFor="let val of values.controls; let i = index"
    [formGroupName]="i"
    class="mb-3 border p-3 rounded"
  >
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Value</mat-label>
      <input matInput formControlName="value" />
      <mat-error *ngIf="val.get('value')?.hasError('required')">
        Value is required
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Color</mat-label>
      <input matInput type="color" formControlName="color" />
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Order</mat-label>
      <input matInput type="number" formControlName="order" min="0" max="1000" />
    </mat-form-field>

    <button mat-raised-button color="warn" (click)="removeValue(i)" *ngIf="values.length > 1">
      Remove
    </button>
  </div>

  <button mat-raised-button color="primary" (click)="addValue()">Add Value</button>
</div>


  </mat-dialog-content>
  <mat-dialog-actions class="d-flex gap-2 justify-content-center">
    <div class="button-group">
      <button
        class="save-btn"
        *ngIf="paramVal === 'Create'"
        (click)="onSubmit()"
      >
        Submit
      </button>
      <button class="save-btn" *ngIf="paramVal === 'Edit'" (click)="onSubmit()">
        Update
      </button>
      <button class="cancel-btn" (click)="onCancel()">Cancel</button>
    </div>
  </mat-dialog-actions>
</form>
