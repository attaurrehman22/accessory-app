<div class="">
  <div class="row">
    <div class="col-md-12">
      <h1>Inventories</h1>
    </div>
    <div class="col-lg-12 col-md-12 col-sm-12">
      <div class="row">
        <div class="col-8 col-lg-8 col-md-8 col-sm-6 d-flex gap-2 mat-form-fields-custom-deisgn">
          <mat-form-field appearance="outline">
            <mat-label>Search</mat-label>
            <input
              matInput
              (keyup)="applyFilter($event)"
              placeholder="Search"
              #input
            />
          </mat-form-field>
        </div>

        <div
          class="col-4 col-lg-4 col-md-4 col-sm-6 d-flex justify-content-end align-items-center"
        >
          <button
             class="admin-add-btn"
            (click)="openModal()"
          >
            Add Category
          </button>
        </div>
      </div>
      <div class="table-conatiner">
        <table
          class="table admin-table"
          mat-table
          [dataSource]="dataSource"
          matSort
        >
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Title
            </th>
            <td mat-cell *matCellDef="let row">{{ row.title }}</td>
          </ng-container>

          <ng-container matColumnDef="condition">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Condition
            </th>
            <td mat-cell *matCellDef="let row">
              {{ row.condition }}
            </td>
          </ng-container>

          <ng-container matColumnDef="brand">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Brand
            </th>
            <td mat-cell *matCellDef="let row">{{ row.brand }}</td>
          </ng-container>

          <ng-container matColumnDef="active">
            <th mat-header-cell *matHeaderCellDef>Active</th>
            <td mat-cell *matCellDef="let row">
              {{ row.active ? "Yes" : "No" }}
            </td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let row">
              <button  matTooltip="Edit Inventory" mat-icon-button color="primary" (click)="editCategory(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button  matTooltip="Delete Inventory" mat-icon-button color="warn" (click)="deleteCategory(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
          ></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="100%">
              No data matching the filter
            </td>
          </tr>
        </table>

        <mat-paginator
          #paginator
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
        ></mat-paginator>
      </div>
    </div>
  </div>
</div>
