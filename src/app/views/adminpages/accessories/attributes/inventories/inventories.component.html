<div class="">
  <div class="row">
    <div class="col-md-12">
      <div class="row">
        <div class="col-md-10">
          <br />
          <h1>Inventories</h1>
        </div>
        <div class="col-md-1"></div>
      </div>
    </div>
    <div class="row g-0">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <div class="table">
          <mat-card class="mt card-class">
            <mat-card-content>
              <div class="row">
                <div class="col-8 col-lg-8 col-md-8 col-sm-6 d-flex gap-2">
                  <mat-form-field appearance="outline">
                    <mat-label>Search</mat-label>
                    <input
                      matInput
                      (keyup)="applyFilter($event)"
                      placeholder="Search"
                      #input
                    />
                  </mat-form-field>
                </div>

                <div
                  class="col-4 col-lg-4 col-md-4 col-sm-6 d-flex justify-content-end align-items-center"
                >
                  <button
                    mat-raised-button
                    color="primary"
                    (click)="openModal()"
                  >
                    <mat-icon>add_circle_outline</mat-icon>Add Category
                  </button>
                </div>
              </div>
              <mat-card class="card-class">
                <div class="mat-elevation-z8">
                  <table
                    class="table"
                    mat-table
                    [dataSource]="dataSource"
                    matSort
                  >
                    <ng-container matColumnDef="title">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Title
                      </th>
                      <td mat-cell *matCellDef="let row">{{ row.title }}</td>
                    </ng-container>

                    <!-- <ng-container matColumnDef="accessory_id">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Accessory ID
                      </th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.accessory_id }}
                      </td>
                    </ng-container> -->

                    <ng-container matColumnDef="condition">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Condition
                      </th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.condition }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="brand">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Brand
                      </th>
                      <td mat-cell *matCellDef="let row">{{ row.brand }}</td>
                    </ng-container>

                    <!-- <ng-container matColumnDef="sku">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        SKU
                      </th>
                      <td mat-cell *matCellDef="let row">{{ row.sku }}</td>
                    </ng-container>

                    

                    <ng-container matColumnDef="condition_note">
                      <th mat-header-cell *matHeaderCellDef>Condition Note</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.condition_note }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="description">
                      <th mat-header-cell *matHeaderCellDef>Description</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.description }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="key_features">
                      <th mat-header-cell *matHeaderCellDef>Key Features</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.key_features }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="stock_quantity">
                      <th mat-header-cell *matHeaderCellDef>Stock</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.stock_quantity }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="damaged_quantity">
                      <th mat-header-cell *matHeaderCellDef>Damaged</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.damaged_quantity }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="user_id">
                      <th mat-header-cell *matHeaderCellDef>User ID</th>
                      <td mat-cell *matCellDef="let row">{{ row.user_id }}</td>
                    </ng-container>

                    <ng-container matColumnDef="purchase_price">
                      <th mat-header-cell *matHeaderCellDef>Purchase Price</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.purchase_price }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="sale_price">
                      <th mat-header-cell *matHeaderCellDef>Sale Price</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.sale_price }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="offer_price">
                      <th mat-header-cell *matHeaderCellDef>Offer Price</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.offer_price }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="offer_start">
                      <th mat-header-cell *matHeaderCellDef>Offer Start</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.offer_start | date }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="offer_end">
                      <th mat-header-cell *matHeaderCellDef>Offer End</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.offer_end | date }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="shipping_weight">
                      <th mat-header-cell *matHeaderCellDef>Weight</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.shipping_weight }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="free_shipping">
                      <th mat-header-cell *matHeaderCellDef>Free Shipping</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.free_shipping ? "Yes" : "No" }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="available_from">
                      <th mat-header-cell *matHeaderCellDef>Available From</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.available_from | date }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="min_order_quantity">
                      <th mat-header-cell *matHeaderCellDef>Min Order</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.min_order_quantity }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="slug">
                      <th mat-header-cell *matHeaderCellDef>Slug</th>
                      <td mat-cell *matCellDef="let row">{{ row.slug }}</td>
                    </ng-container>

                    <ng-container matColumnDef="linked_items">
                      <th mat-header-cell *matHeaderCellDef>Linked Items</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.linked_items }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="meta_title">
                      <th mat-header-cell *matHeaderCellDef>Meta Title</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.meta_title }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="meta_description">
                      <th mat-header-cell *matHeaderCellDef>
                        Meta Description
                      </th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.meta_description }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="stuff_pick">
                      <th mat-header-cell *matHeaderCellDef>Staff Pick</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.stuff_pick ? "Yes" : "No" }}
                      </td>
                    </ng-container> -->

                    <ng-container matColumnDef="active">
                      <th mat-header-cell *matHeaderCellDef>Active</th>
                      <td mat-cell *matCellDef="let row">
                        {{ row.active ? "Yes" : "No" }}
                      </td>
                    </ng-container>

                    <ng-container matColumnDef="action">
                      <th mat-header-cell *matHeaderCellDef>Action</th>
                      <td mat-cell *matCellDef="let row">
                        <button
                          style="width: 0; height: 0; padding: 0"
                          mat-icon-button
                          [matMenuTriggerFor]="menu"
                          (click)="$event.stopPropagation()"
                        >
                          <mat-icon>info</mat-icon>
                        </button>
                        <mat-menu #menu="matMenu">
                          <button mat-menu-item (click)="editCategory(row)">
                            <mat-icon>edit</mat-icon>
                            <span>Edit</span>
                          </button>
                          <button mat-menu-item (click)="deleteCategory(row)">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                          </button>
                        </mat-menu>
                      </td>
                    </ng-container>

                    <tr
                      mat-header-row
                      *matHeaderRowDef="displayedColumns; sticky: true"
                    ></tr>
                    <tr
                      mat-row
                      *matRowDef="let row; columns: displayedColumns"
                    ></tr>

                    <tr class="mat-row" *matNoDataRow>
                      <td class="mat-cell" colspan="100%">
                        No data matching the filter
                      </td>
                    </tr>
                  </table>

                  <mat-paginator
                    #paginator
                    [pageSizeOptions]="[5, 10, 20]"
                    showFirstLastButtons
                  ></mat-paginator>
                </div>
              </mat-card>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
