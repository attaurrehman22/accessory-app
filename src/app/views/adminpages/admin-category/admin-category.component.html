<div class="">
    <div class="row">
      <div class="col-md-12">
        <div class="row">
          <div class="col-md-2">
            <br />
            <h1>Category</h1>
          </div>
          <div class="col-md-1"></div>
        </div>
      </div>
      <div class="row g-0">
        
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="table">
            <mat-card class="mt">
              <mat-card-content>
                <div class="row">
                  <div class="col-8 col-lg-8 col-md-8 col-sm-6">
                    <mat-form-field appearance="outline">
                      <mat-label>Search</mat-label>
  
                      <input
                        matInput
                        (keyup)="applyFilter($event)"
                        placeholder="Ex. Admin"
                        #input
                      />
                    </mat-form-field>
                    &nbsp;
                  </div>
                  
                  <div class="col-4 col-lg-4 col-md-4 col-sm-6 d-flex justify-content-end align-items-center">
                    <button
                      [hidden]="!isAdmin()"
                      mat-raised-button
                      color="primary"
                      (click)="openModal()"
                    >
                      <mat-icon>add_circle_outline</mat-icon>Add Category 
                    </button>
                  </div>
                </div>
                <mat-card>
                  <div class="mat-elevation-z8">
                    <table class="table" mat-table [dataSource]="dataSource">
                      <!-- ID Column -->
                      <ng-container class="column" matColumnDef="prod_name">
                        <th mat-header-cell class="column" *matHeaderCellDef>
                          Category Name
                        </th>
                        <td mat-cell class="column" *matCellDef="let row">
                          {{ row.name }}
                        </td>
                      </ng-container>
  
                      <!-- First Name Column -->
                      <ng-container class="column" matColumnDef="brand_name">
                        <th mat-header-cell class="column" *matHeaderCellDef>
                          Slug
                        </th>
                        <td mat-cell class="column" *matCellDef="let row; in">
                          {{ row.slug }}
                        </td>
                      </ng-container>
  
                      <!-- Last Name Column -->
                      <ng-container class="column" matColumnDef="category">
                        <th mat-header-cell class="column" *matHeaderCellDef>
                          Meta Title
                        </th>
                        <td mat-cell class="column" *matCellDef="let row; in">
                          {{ row.meta_title }}
                        </td>
                      </ng-container>

                      <ng-container class="column" matColumnDef="top_category">
                        <th mat-header-cell class="column" *matHeaderCellDef>
                          Is On Top
                        </th>
                        <td mat-cell class="column" *matCellDef="let row; in">
                          {{ row.top_category === 0 ? 'No' : 'Yes' }}
                        </td>
                      </ng-container>
  
                      <ng-container class="column" matColumnDef="price">
                        <th mat-header-cell class="column" *matHeaderCellDef>
                          Is Active
                        </th>
                        <td mat-cell class="column" *matCellDef="let row; in">
                          {{ row.is_active === 0 ? 'No' : 'Yes' }}
                        </td>
                      </ng-container>
  
                      <!-- Status Column -->
                      <ng-container class="column" matColumnDef="edit">
                        <th mat-header-cell class="column" *matHeaderCellDef>
                          Action
                        </th>
                        <td mat-cell class="column" *matCellDef="let row; in">
                          <!-- <button
                            (click)="editUser(row)"
                            mat-raised-button
                            [color]="row.isBlocked ? 'warn' : 'primary'"
                          >
                            Edit
                          </button> -->


                          <button
                          style="width: 0; height: 0; padding: 0"
                          mat-icon-button
                          [matMenuTriggerFor]="menu"
                          (click)="$event.stopPropagation()"
                        >
                          <mat-icon>info</mat-icon>
                        </button>
                        <mat-menu #menu="matMenu">
                          <button mat-menu-item (click)="editUser(row)">
                            <mat-icon>edit</mat-icon>
                            <span>Edit</span>
                          </button>
                          <button mat-menu-item (click)="deleteCategory(row)">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                          </button>
                          <button mat-menu-item (click)="activateDeactivateCategory(row)">
                            <mat-icon>refresh</mat-icon>
                            <span *ngIf="row.is_active === 1">Deactivate</span>
                            <span *ngIf="row.is_active === 0">Activate</span>
                          </button>
                        </mat-menu>


                        </td>
                      </ng-container>
  
                      <tr
                        mat-header-row
                        *matHeaderRowDef="displayedColumns; sticky: true"
                      ></tr>
                      <tr
                        mat-row
                        *matRowDef="let row; columns: displayedColumns"
                      ></tr>
  
                      <!-- Row shown when there is no matching data. -->
                      <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="4">
                          No data matching the filter "{{ input.value }}"
                        </td>
                      </tr>
                    </table>
  
                    <mat-paginator
                      #paginator
                      [pageSizeOptions]="[5, 10, 20]"
                      showFirstLastButtons
                    ></mat-paginator>
                  </div>
                </mat-card>
                <!-- <div class="d-flex justify-content-end">
                  <button mat-raised-button color="primary" (click)="download()">
                    <mat-icon>cloud_download</mat-icon>Download Users
                  </button>
                </div> -->
              </mat-card-content>
            </mat-card>
          </div>
        </div>
        
      </div>
    </div>
  </div>
