<div class="">
    <div class="row">
      <div class="col-md-12">
        <h1>Attribute Inventory</h1>
      </div>
      <div class="col-md-12">
        <div class="row">
          <div class="col-8 col-lg-8 col-md-8 col-sm-6 mat-form-fields-custom-deisgn">
            <mat-form-field appearance="outline">
              <mat-label>Search</mat-label>
              <input
                matInput
                (keyup)="applyFilter($event)"
                placeholder="Ex. Admin"
                #input
              />
            </mat-form-field>
            &nbsp;
          </div>

          <div class="col-4 col-lg-4 col-md-4 col-sm-6 d-flex justify-content-end align-items-center">
            <button
              class="admin-add-btn"
              (click)="openModal()"
            >
              Add Category
            </button>
          </div>
        </div>
        <div class="table-conatiner">
          <table class="table admin-table" mat-table [dataSource]="dataSource">
            <!-- ID Column -->
            <ng-container class="column" matColumnDef="attribute_id">
              <th mat-header-cell class="column" *matHeaderCellDef>
                Attribute
              </th>
              <td mat-cell class="column" *matCellDef="let row">
                {{ row.attribute_id }}
              </td>
            </ng-container>

            <!-- First Name Column -->
            <ng-container class="column" matColumnDef="inventory_id">
              <th mat-header-cell class="column" *matHeaderCellDef>
                Inventory
              </th>
              <td mat-cell class="column" *matCellDef="let row; in">
                {{ row.inventory_id }}
              </td>
            </ng-container>

            <!-- Last Name Column -->
            <ng-container class="column" matColumnDef="attribute_value_id">
              <th mat-header-cell class="column" *matHeaderCellDef>
                Attribute value
              </th>
              <td mat-cell class="column" *matCellDef="let row; in">
                {{ row.meta_title }}
              </td>
            </ng-container>

            <ng-container matColumnDef="edit">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary"
                      (click)="editAttribute(row)"
                      matTooltip="Edit Category">
                <mat-icon>edit</mat-icon>
              </button>

              <button mat-icon-button color="warn"
                      (click)="deleteAttribute(row)"
                      matTooltip="Delete Category">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

            <tr
              mat-header-row
              *matHeaderRowDef="displayedColumns; sticky: true"
            ></tr>
            <tr
              mat-row
              *matRowDef="let row; columns: displayedColumns"
            ></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" colspan="4">
                No data matching the filter "{{ input.value }}"
              </td>
            </tr>
          </table>

          <mat-paginator
            #paginator
            [pageSizeOptions]="[5, 10, 20]"
            showFirstLastButtons
          ></mat-paginator>
        </div>
      </div>
    </div>
  </div>
