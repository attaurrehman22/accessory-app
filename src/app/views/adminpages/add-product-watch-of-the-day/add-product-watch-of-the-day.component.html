<div class="container" style="height: 500px; padding: 10px 20px 10px 20px">
    <h2 *ngIf="param" class="text-center">Edit Watch of The Day </h2>
    <h2 *ngIf="!param" class="text-center">Add Watch of The Day </h2>
  <form [formGroup]="watchDayForm" class="mt-3" (ngSubmit)="saveData()">
    <div>
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Select Product</mat-label>
        <mat-select formControlName="product_id">
          <mat-option *ngFor="let item of allData" [value]="item.id"
            >{{ item?.brand?.name }} {{ item?.name }}</mat-option
          >
        </mat-select>
        <mat-error *ngIf="watchDayForm.get('product_id')?.hasError('required')">
          Product is required.
        </mat-error>
      </mat-form-field>
    </div>

    <div>
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Select Background Color</mat-label>
        <input required matInput formControlName="background_color" />
        <mat-error
          *ngIf="watchDayForm.get('background_color')?.hasError('required')"
        >
          Background Color is required.
        </mat-error>
      </mat-form-field>
    </div>

    <div class="mt-3">
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Type</mat-label>
        <input required matInput formControlName="type" />
        <mat-error *ngIf="watchDayForm.get('type')?.hasError('required')">
          Type is required.
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Image Upload Field -->
    <div class="">
      <div class="upload-box" style="cursor: pointer;" (click)="selectCoverImage()">
        <ng-container
          *ngIf="
            coverImage?.url &&
              coverImage.url !== 'https://api.chronosouq.com/null';
            else uploadPlaceholder
          "
        >
          <img
            *ngIf="
              coverImage?.url &&
              coverImage.url !== 'https://api.chronosouq.com/null'
            "
            style="height: 100%; width: 100%; object-fit: cover"
            [src]="coverImage.url"
            alt="Cover Image"
          />

          <button
            *ngIf="
              coverImage?.url &&
              coverImage.url !== 'https://api.chronosouq.com/null'
            "
            class="delete-btn"
            (click)="removeCoverImage()"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </ng-container>
        <ng-template #uploadPlaceholder>
          <span style="display: contents;font-size: 35px;">+ Upload Banner</span>
        </ng-template>
      </div>
      <input
        type="file"
        #coverImageInput
        (change)="onCoverImageSelected($event)"
        accept="image/*"
        hidden
      />
    </div>

    <!-- Save Button -->
    <div class="col-12 d-flex flex-wrap mt-3 gap-2 justify-content-center">
      <button
      *ngIf="!param"
      class="save-btn"
        type="submit"
        [disabled]="!watchDayForm.valid"
      >
        Save
      </button>

      <button
      *ngIf="param"
      class="save-btn"
        type="submit"
        [disabled]="!watchDayForm.valid"
      >
        Edit
      </button>
      
      <button
      (click)="cancelForm()"
      class="cancel-btn"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
